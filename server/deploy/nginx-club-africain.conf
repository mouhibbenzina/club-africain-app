upstream club_africain_api {
  server 127.0.0.1:3001;
  keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

server {
  listen 80;
  server_name api.votre-domaine.tn;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.votre-domaine.tn;

  # TLS — utilisez Certbot / Let's Encrypt ou vos propres certificats
  ssl_certificate     /etc/letsencrypt/live/api.votre-domaine.tn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.votre-domaine.tn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # Sécurité générale
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  client_max_body_size 2m;

  # API
  location / {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://club_africain_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Auth — plus strict
  location /auth {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://club_africain_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Pages d'erreur personnalisées
  error_page 429 @rate_limit;
  location @rate_limit {
    default_type application/json;
    return 429 '{"error":"Trop de requêtes. Réessayez plus tard."}';
  }
}