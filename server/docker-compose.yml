version: "3.9"
services:
  api:
    build: .
    container_name: club-africain-api
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3001}
      - DB_PATH=/app/data/club_africain.db
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-mock}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET}
      - MAILER=${MAILER:-console}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM:-"Club Africain App <no-reply@clubafricain.tn>"}
      - REQUIRE_EMAIL_VERIFICATION=${REQUIRE_EMAIL_VERIFICATION:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@clubafricain.tn}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123!}
      - TRUST_PROXY=true
      - AUTO_BACKUP=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups